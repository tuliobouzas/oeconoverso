<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Filetes do frame para border-image (9-slice, slice=16, border-width~14px).
       CANTOS VAZIOS: as linhas existem só nas bordas (região 16..84) e param
       antes da quina, pra NÃO invadir o ornamento de canto (que fica por cima). -->
  <g stroke="#dab77f" fill="none" stroke-linecap="butt">
    <!-- topo: grosso + fino -->
    <line x1="16" y1="2.4" x2="84" y2="2.4" stroke-width="3"/>
    <line x1="16" y1="9"   x2="84" y2="9"   stroke-width="1.4"/>
    <!-- base -->
    <line x1="16" y1="97.6" x2="84" y2="97.6" stroke-width="3"/>
    <line x1="16" y1="91"   x2="84" y2="91"   stroke-width="1.4"/>
    <!-- esquerda -->
    <line x1="2.4" y1="16" x2="2.4" y2="84" stroke-width="3"/>
    <line x1="9"   y1="16" x2="9"   y2="84" stroke-width="1.4"/>
    <!-- direita -->
    <line x1="97.6" y1="16" x2="97.6" y2="84" stroke-width="3"/>
    <line x1="91"   y1="16" x2="91"   y2="84" stroke-width="1.4"/>
  </g>
</svg>
