<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice">
  <!-- Placeholder desenhado à mão: skyline art déco noturno.
       Pode ser substituído por skyline-title.webp gerado por IA (ver prompts.md). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1517"/>
      <stop offset="0.62" stop-color="#11292f"/>
      <stop offset="1" stop-color="#173a41"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#c98f3f" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#c98f3f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c98f3f" stop-opacity="0"/>
    </radialGradient>
    <!-- janelas acesas (densas e esparsas) -->
    <pattern id="w1" width="14" height="24" patternUnits="userSpaceOnUse">
      <rect width="14" height="24" fill="#0a1315"/>
      <rect x="3.5" y="6" width="5" height="8" fill="#e8a84c" opacity="0.8"/>
    </pattern>
    <pattern id="w2" width="18" height="28" patternUnits="userSpaceOnUse">
      <rect width="18" height="28" fill="#0b1618"/>
      <rect x="5" y="8" width="5.5" height="8.5" fill="#c98f3f" opacity="0.45"/>
      <rect x="12" y="18" width="4" height="6" fill="#e8a84c" opacity="0.25"/>
    </pattern>
    <pattern id="w3" width="16" height="26" patternUnits="userSpaceOnUse">
      <rect width="16" height="26" fill="#0a1416"/>
      <rect x="4" y="7" width="5" height="8" fill="#d99b45" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" fill="url(#sky)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- camada de fundo (silhuetas distantes, sem janelas) -->
  <g fill="#0e2026">
    <rect x="60"   y="150" width="90"  height="270"/>
    <rect x="85"   y="120" width="40"  height="60"/>
    <rect x="230"  y="180" width="70"  height="240"/>
    <rect x="420"  y="140" width="80"  height="280"/>
    <rect x="445"  y="105" width="30"  height="50"/>
    <rect x="640"  y="200" width="100" height="220"/>
    <rect x="900"  y="170" width="80"  height="250"/>
    <rect x="925"  y="135" width="30"  height="50"/>
    <rect x="1090" y="190" width="90"  height="230"/>
    <rect x="1290" y="150" width="70"  height="270"/>
    <rect x="1310" y="115" width="30"  height="50"/>
    <rect x="1470" y="180" width="90"  height="240"/>
  </g>

  <!-- camada principal (prédios com janelas, topos escalonados art déco) -->
  <!-- esquerda -->
  <g>
    <rect x="0" y="210" width="120" height="210" fill="url(#w2)"/>
    <rect x="130" y="130" width="100" height="290" fill="url(#w1)"/>
    <rect x="150" y="100" width="60" height="34" fill="#0a1315"/>
    <rect x="168" y="76"  width="24" height="28" fill="#0a1315"/>
    <rect x="179" y="46"  width="3"  height="32" fill="#0a1315"/>
    <circle cx="180.5" cy="44" r="2.6" fill="#ffd98c"/>
    <rect x="250" y="250" width="130" height="170" fill="url(#w3)"/>
    <rect x="285" y="222" width="60" height="30" fill="#0b1618"/>
    <rect x="395" y="170" width="90" height="250" fill="url(#w2)"/>
    <rect x="415" y="140" width="50" height="32" fill="#0a1416"/>
    <rect x="500" y="290" width="110" height="130" fill="url(#w1)"/>
  </g>
  <!-- centro (mais baixo e discreto — área do logotipo) -->
  <g opacity="0.9">
    <rect x="640" y="330" width="110" height="90" fill="url(#w2)"/>
    <rect x="770" y="345" width="90"  height="75" fill="url(#w3)"/>
    <rect x="880" y="325" width="100" height="95" fill="url(#w2)"/>
  </g>
  <!-- direita -->
  <g>
    <rect x="1000" y="280" width="110" height="140" fill="url(#w3)"/>
    <rect x="1030" y="252" width="50"  height="30"  fill="#0a1416"/>
    <rect x="1130" y="150" width="100" height="270" fill="url(#w1)"/>
    <rect x="1152" y="118" width="56"  height="34"  fill="#0a1315"/>
    <rect x="1170" y="92"  width="22"  height="28"  fill="#0a1315"/>
    <rect x="1180" y="60"  width="3"   height="34"  fill="#0a1315"/>
    <circle cx="1181.5" cy="58" r="2.6" fill="#ffd98c"/>
    <rect x="1250" y="240" width="120" height="180" fill="url(#w2)"/>
    <rect x="1385" y="180" width="95"  height="240" fill="url(#w3)"/>
    <rect x="1405" y="150" width="55"  height="32"  fill="#0a1416"/>
    <rect x="1495" y="260" width="105" height="160" fill="url(#w1)"/>
  </g>

  <!-- brilho da rua na base -->
  <rect x="0" y="404" width="1600" height="16" fill="#080f11"/>
  <rect x="0" y="402" width="1600" height="3" fill="#c98f3f" opacity="0.35"/>
</svg>
